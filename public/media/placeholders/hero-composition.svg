<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
  <title id="title">Replaceable hero visual</title>
  <desc id="desc">Placeholder composition for an approved STS Media studio still. Recommended file: public/media/hero/studio-still.webp at 1600 by 1800.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1E1C"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="0.7" fill="#F3EFE7" opacity="0.12"/>
      <circle cx="42" cy="28" r="0.5" fill="#C7FF3D" opacity="0.18"/>
      <circle cx="70" cy="54" r="0.6" fill="#B8BDBA" opacity="0.14"/>
      <circle cx="22" cy="66" r="0.5" fill="#F3EFE7" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1800" fill="url(#wash)"/>
  <rect width="1600" height="1800" fill="url(#grain)"/>
  <rect x="90" y="110" width="980" height="1180" fill="#F3EFE7"/>
  <rect x="620" y="420" width="880" height="1120" fill="#1B1E1C" stroke="#B8BDBA" stroke-width="2"/>
  <rect x="90" y="1540" width="220" height="12" fill="#C7FF3D"/>
  <text x="90" y="160" fill="#0B0D0C" font-family="Georgia, serif" font-size="28" letter-spacing="8">01 / STUDIO</text>
  <text x="90" y="430" fill="#0B0D0C" font-family="Georgia, serif" font-size="92">Unmissable</text>
  <text x="90" y="520" fill="#0B0D0C" font-family="Georgia, serif" font-size="92">is a visual</text>
  <text x="90" y="610" fill="#0B0D0C" font-family="Georgia, serif" font-size="92">problem.</text>
  <text x="680" y="510" fill="#C7FF3D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="6">REPLACEABLE ASSET</text>
  <text x="680" y="560" fill="#F3EFE7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28">studio-still.webp</text>
  <text x="680" y="604" fill="#B8BDBA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">1600 × 1800 · WebP · original still</text>
  <rect x="680" y="680" width="760" height="430" fill="#0B0D0C"/>
  <rect x="720" y="720" width="680" height="40" fill="#1B1E1C"/>
  <circle cx="742" cy="740" r="6" fill="#91A38F"/>
  <circle cx="766" cy="740" r="6" fill="#B8BDBA"/>
  <circle cx="790" cy="740" r="6" fill="#C7FF3D"/>
  <rect x="720" y="790" width="420" height="18" fill="#F3EFE7" opacity="0.85"/>
  <rect x="720" y="828" width="280" height="12" fill="#91A38F" opacity="0.7"/>
  <rect x="720" y="880" width="680" height="190" fill="#1B1E1C"/>
  <text x="90" y="1720" fill="#B8BDBA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Do not crop important content. Swap this file in place.</text>
